[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "klarna"
description = "The Disputes API offers Klarna partners and merchants an easy way to handle customer disputes.  Use the available endpoints to: * Get a list of disputes, filtered by various parameters. * Get a full, detailed version of a dispute, including all the associated requests and responses. * Respond to a dispute request. * Download/upload a file attachment linked to a specific request response. * Accept loss for a dispute. * Represent (respond to) a dispute. * Appeal a dispute decision.  Klarna merchants consuming Disputes API are authenticated via the OAuth 2.0 protocol or API keys.  Before you get started, please make sure you understand the disputes process.  ### FAQ * Why is the API returning 403?   * Please make sure your credentials and the endpoint you're calling are correct. Klarna APIs may also respond with a 403 for invalid paths. * GET v4/disputes returns an empty list, why?   * Are you sure there are disputes to list?   * Since you got through to the endpoint your client credentials are valid. Some partners or merchants may have been onboarded to the api incorrectly. * Why am I getting an invalid date format when responding to a dispute?   * Only the following ISO 8601 format is currently supported: `YYYY-MM-DDTHH:mm:ss.sssZ`. Please note it includes ms., Hosted Payment Page (HPP) API is a service that lets you integrate Klarna Payments without the need of hosting the web page that manages the client side of Klarna Payments. A complete HPP payment session will involve three of Klarna services: * [`Klarna Payments API`](https://docs.klarna.com/api/payments/) to start a payment session. * [`Hosted Payment Page API`](https://docs.klarna.com/api/hpp-merchant) to distribute a payment session. * [`Order Management API`](https://docs.klarna.com/api/ordermanagement) to capture payment or refund consumer.  Read more on [Hosted payment page](https://docs.klarna.com/hosted-payment-page/)., The Merchant Card Service (MCS) API is used to settle orders with virtual credit cards.  Read more on [Merchant card service](https://docs.klarna.com/merchant-card-service/)., The Order Management API is used for handling an order after the customer has completed the purchase. It is used for all actions you need to manage your orders. Examples being: updating, capturing, reading and refunding an order.  Read more on the [Order management](https://docs.klarna.com/order-management/) process., The payments API is used to create a session to offer Klarna's payment methods as part of your checkout. As soon as the purchase is completed the order should be read and handled using the [`Order Management API`](https://docs.klarna.com/api/ordermanagement).  **Note:** Examples provided in this section includes full payloads, including all supported fields, required and optionals. In order to implement a best in class request we recommend you don't include customer details when initiating a payment session. Refer to [Initiate a payment](https://docs.klarna.com/klarna-payments/integrate-with-klarna-payments/step-1-initiate-a-payment/) section for further details.  Read more on [Klarna payments](https://docs.klarna.com/klarna-payments/)., The Settlements API helps you with the reconciliation of payments, made by Klarna to your bank account. Every payment has a unique payment_reference that can be found in the settlement reports and on your bank statement.  Read more on [Settlement reports](https://docs.klarna.com/settlement-reports/)."
version = "1.0.0"
dependencies = ["apimatic-core~=0.2.0, >= 0.2.24", "apimatic-core-interfaces~=0.1.0, >= 0.1.8", "apimatic-requests-client-adapter~=0.1.0, >= 0.1.10", "python-dotenv>=0.21, <2.0"]
requires-python = ">=3.7"
[[project.authors]]
name = "APIMatic Code Generator"
email = "support@apimatic.io"

[project.optional-dependencies]
testutils = ["pytest>=7.2.2", "pytest-django>=4.5.2, <5", "Django~=3.2.25 ; python_version < '3.13'", "Django~=5.1.3 ; python_version >= '3.13'", "Flask~=2.2.5", "fastapi~=0.95.2", "httpx~=0.24.1", "anyio~=3.7.1", "typing-extensions~=4.7.1", "Werkzeug>=2.2, <3.0"]
[tool]
[tool.setuptools]
[tool.setuptools.packages]
[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]
